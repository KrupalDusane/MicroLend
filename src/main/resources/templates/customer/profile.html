<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('Profile')}"></head>
<body>
    <div class="app-container">
        <div th:replace="~{fragments/sidebar :: customerSidebar}"></div>
        <div class="main-content">
            <div th:replace="~{fragments/navbar :: navbar}"></div>
            <div class="content-wrapper">
                <h1 class="mb-4">My Profile</h1>
                
                <div id="profileLoading" class="alert alert-info">Loading profile...</div>
                <div id="profileMissingMessage" class="alert alert-warning" style="display: none;">Complete your profile to continue.</div>
                <div id="profileError" class="alert alert-danger" style="display: none;"></div>
                <div id="profileSuccess" class="alert alert-success" style="display: none;">Profile saved successfully.</div>
                
                <div class="card" style="max-width: 600px;" id="profileCard">
                    <form id="profileForm" style="display: none;">
                        <div class="form-group">
                            <label class="form-label" for="fullName">Full Legal Name</label>
                            <input type="text" id="fullName" class="form-control" required minlength="2" maxlength="100">
                        </div>
                        <div class="form-group">
                            <label class="form-label" for="phoneNumber">Phone Number</label>
                            <input type="text" id="phoneNumber" class="form-control" required pattern="^\+?[0-9. ()-]{7,25}$">
                        </div>
                        <div class="form-group">
                            <label class="form-label" for="dateOfBirth">Date of Birth</label>
                            <input type="date" id="dateOfBirth" class="form-control" required>
                        </div>
                        <div class="form-group">
                            <label class="form-label" for="address">Address</label>
                            <input type="text" id="address" class="form-control" required minlength="5" maxlength="500">
                        </div>
                        <div class="form-group">
                            <label class="form-label" for="employmentType">Employment Type</label>
                            <select id="employmentType" class="form-control" required>
                                <option value="SALARIED">Salaried</option>
                                <option value="SELF_EMPLOYED">Self Employed</option>
                                <option value="BUSINESS">Business</option>
                                <option value="UNEMPLOYED">Unemployed</option>
                            </select>
                        </div>
                        <div class="form-group">
                            <label class="form-label" for="monthlyIncome">Monthly Income (₹)</label>
                            <input type="number" id="monthlyIncome" class="form-control" required min="0.01" step="0.01">
                        </div>
                        
                        <button type="submit" class="btn btn-primary mt-3" id="saveProfileBtn">Save Profile</button>
                    </form>
                </div>
            </div>
        </div>
    </div>
    <script th:src="@{/js/customer.js}"></script>
</body>
</html>
