<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('Register')}"></head>
<body>
    <div class="app-container" style="justify-content: center; align-items: center; padding: 2rem 0;">
        <div class="card" style="width: 100%; max-width: 500px;">
            <h2 class="card-title text-center mb-4">Register for MicroLend</h2>
            
            <form id="registerForm">
                <div class="form-group">
                    <label class="form-label" for="name">Full Name</label>
                    <input type="text" id="name" class="form-control" placeholder="John Doe" required>
                </div>

                <div class="form-group">
                    <label class="form-label" for="email">Email</label>
                    <input type="email" id="email" class="form-control" placeholder="john.doe@example.com" required>
                </div>
                
                <div class="form-group">
                    <label class="form-label" for="password">Password</label>
                    <input type="password" id="password" class="form-control" placeholder="Create a strong password" required>
                </div>
                
                <button type="submit" class="btn btn-primary" style="width: 100%;">Register</button>
                
                <div class="text-center mt-3">
                    <span class="text-muted">Already have an account? </span>
                    <a th:href="@{/login}">Login</a>
                </div>
            </form>
        </div>
    </div>
    <script th:src="@{/js/auth.js}"></script>
</body>
</html>
