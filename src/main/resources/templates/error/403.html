<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('Access Denied')}"></head>
<body>
    <div class="app-container" style="justify-content: center; align-items: center; flex-direction: column;">
        <h1 style="font-size: 4rem; color: var(--status-error);">403</h1>

</html>
