<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('Not Found')}"></head>
<body>
    <div class="app-container" style="justify-content: center; align-items: center; flex-direction: column;">
        <h1 style="font-size: 4rem; color: var(--status-warning);">404</h1>
        <h2 class="mb-3">Page Not Found</h2>

        <a th:href="@{/login}" class="btn btn-primary">Return to Login</a>
    </div>
</body>
</html>
